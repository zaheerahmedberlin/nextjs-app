name: Sync AWIN Product Feeds

on:
  schedule:
    - cron: "0 2 * * *"  # Every day at 2am UTC
  workflow_dispatch:       # Allow manual trigger from GitHub UI

# A manual dispatch that lands close to the scheduled run (or two manual
# triggers back to back) used to execute in parallel — each run's "which
# rows already exist" snapshot was taken before the other's writes landed,
# so both inserted their own copy of the same products. Queuing instead of
# running concurrently makes that race impossible; the queued run just
# starts fresh once the first one finishes.
concurrency:
  group: sync-awin-feeds
  cancel-in-progress: false

# 2026-09: runs via SSH against the netcup box's own scripts/run_cron.sh
# dispatcher instead of connecting to Postgres/Redis directly from GitHub's
# runners — the DB isn't exposed to the public internet (firewall only
# allows 22/80/443), so this avoids opening it up just for these jobs.
# The SSH key is restricted (forced command) to exactly these job names.
jobs:
  # These four jobs used to all run in parallel, each opening its own SSH
  # session to the same small netcup VPS at the same instant. That matches
  # the exact failure mode already learned the hard way with manual vendor
  # imports (see project memory: "never run two large imports at once, they
  # starve each other over the network") — just never applied to this
  # workflow. Confirmed live: on 2026-09-06 and 2026-09-13 (both Sundays,
  # the only day weekly-dead-link-check actually does its heavy sweep
  # instead of skipping), sync-voghion AND weekly-dead-link-check both died
  # with exit 255 and zero output within ~2-4 minutes — the signature of an
  # abrupt kill (most likely OOM from four heavy jobs hitting the server
  # concurrently), not a script error. `needs:` chains them to run one at a
  # time instead; `if: always()` keeps a failure in one from skipping the
  # rest, preserving the original intent of the split (one slow/failed job
  # shouldn't block the others) without the concurrent server load.

  # Voghion's feed (~92,000 raw rows, individual SELECT+INSERT/UPDATE per
  # row) has repeatedly run past 60 minutes on GitHub's runners and gotten
  # cancelled — which used to also skip every step after it in the same job,
  # including the unrelated Shopify-vendor refresh below. Split into its own
  # job so a slow/timed-out Voghion run can't block anything else. Runs
  # first since it's the heaviest/slowest job.
  sync-voghion:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Run Voghion import on server
        env:
          SSH_KEY: ${{ secrets.NETCUP_SSH_KEY }}
          HOST: ${{ secrets.NETCUP_HOST }}
        run: |
          echo "$SSH_KEY" > key.pem && chmod 600 key.pem
          ssh -i key.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 deploy@$HOST "awin-voghion"

  # Everyone else with a feed_url (Centa-Star, DeubaXXL, GERMENS, BlazeVideo,
  # Dowinx, Smartwatcharmbaender — all comfortably fast). Excludes Voghion by
  # name rather than listing these explicitly, so a newly onboarded vendor's
  # feed_url lands here automatically without a workflow edit.
  sync-fast-vendors:
    needs: sync-voghion
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Run AWIN feed importer (all vendors except Voghion) on server
        env:
          SSH_KEY: ${{ secrets.NETCUP_SSH_KEY }}
          HOST: ${{ secrets.NETCUP_HOST }}
        run: |
          echo "$SSH_KEY" > key.pem && chmod 600 key.pem
          ssh -i key.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 deploy@$HOST "awin-fast"

  # Tsarbomba and Sparkle GmbH use Shopify's /products.json, not an AWIN
  # feed — independent of both jobs above.
  sync-shopify-vendors:
    needs: sync-fast-vendors
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Refresh Shopify-API vendors on server
        env:
          SSH_KEY: ${{ secrets.NETCUP_SSH_KEY }}
          HOST: ${{ secrets.NETCUP_HOST }}
        run: |
          echo "$SSH_KEY" > key.pem && chmod 600 key.pem
          ssh -i key.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 deploy@$HOST "awin-shopify"

  # Used to run everything (~453k products) once a week (Sundays only) —
  # that took long enough that the SSH session died from what looked like a
  # network idle-timeout ("client_loop: send disconnect: Broken pipe") well
  # before the script could finish, confirmed live 2026-09-13 running this
  # job alone with no other jobs competing for the server (so it wasn't the
  # concurrency issue the other three jobs had — a separate, genuine scale
  # problem). check_dead_links.py now takes a bounded --batch-size (default
  # 25,000) of the least-recently-checked products each run instead, so this
  # runs daily like the others: a bounded, reliable slice every day instead
  # of one unbounded sweep once a week, and the full catalog still cycles
  # through completely every couple of weeks.
  dead-link-check:
    needs: sync-shopify-vendors
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Dead-link check (bounded daily batch) on server
        env:
          SSH_KEY: ${{ secrets.NETCUP_SSH_KEY }}
          HOST: ${{ secrets.NETCUP_HOST }}
        run: |
          echo "$SSH_KEY" > key.pem && chmod 600 key.pem
          ssh -i key.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 deploy@$HOST "dead-links"
