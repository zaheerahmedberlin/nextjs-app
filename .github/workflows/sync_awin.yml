name: Sync AWIN Product Feeds

on:
  schedule:
    - cron: "0 2 * * *"  # Every day at 2am UTC
  workflow_dispatch:       # Allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install psycopg2-binary unidecode requests

      - name: Run AWIN feed importer
        env:
          RAILWAY_DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: python scripts/import_awin_feeds.py

      - name: Refresh Shopify-API vendors (no AWIN feed available)
        env:
          RAILWAY_DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: python scripts/refresh_shopify_vendors.py

      - name: Weekly dead-link check (Sundays only)
        env:
          RAILWAY_DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: |
          if [ "$(date +%u)" = "7" ]; then
            echo "Sunday — running full dead-link check"
            python scripts/check_dead_links.py
          else
            echo "Not Sunday — skipping weekly dead-link check"
          fi
