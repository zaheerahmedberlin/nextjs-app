name: TEMP DB Check

on:
  workflow_dispatch:

jobs:
  db-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Print DATABASE_URL host/db/user (no password) from the server
        env:
          SSH_KEY: ${{ secrets.NETCUP_SSH_KEY }}
          HOST: ${{ secrets.NETCUP_HOST }}
        run: |
          echo "$SSH_KEY" > key.pem && chmod 600 key.pem
          ssh -i key.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new deploy@$HOST "db-check"
