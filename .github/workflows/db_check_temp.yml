name: TEMP DB Check

on:
  workflow_dispatch:

jobs:
  category-counts:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dump category tree + product counts from the real production DB
        env:
          SSH_KEY: ${{ secrets.NETCUP_SSH_KEY }}
          HOST: ${{ secrets.NETCUP_HOST }}
        run: |
          echo "$SSH_KEY" > key.pem && chmod 600 key.pem
          ssh -i key.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 deploy@$HOST "category-counts"
