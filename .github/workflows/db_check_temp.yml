name: TEMP DB Check

on:
  workflow_dispatch:

jobs:
  add-index:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Add the link_checked_at index on the real production DB
        env:
          SSH_KEY: ${{ secrets.NETCUP_SSH_KEY }}
          HOST: ${{ secrets.NETCUP_HOST }}
        run: |
          echo "$SSH_KEY" > key.pem && chmod 600 key.pem
          ssh -i key.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new deploy@$HOST "add-link-checked-index"
