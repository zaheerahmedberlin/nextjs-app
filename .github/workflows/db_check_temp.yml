name: TEMP DB Check

on:
  workflow_dispatch:

jobs:
  onboard-autofull:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Onboard Autofull EU (AWIN 125332) — DB insert + scoped import only
        env:
          SSH_KEY: ${{ secrets.NETCUP_SSH_KEY }}
          HOST: ${{ secrets.NETCUP_HOST }}
        run: |
          echo "$SSH_KEY" > key.pem && chmod 600 key.pem
          ssh -i key.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 deploy@$HOST "onboard-autofull"
