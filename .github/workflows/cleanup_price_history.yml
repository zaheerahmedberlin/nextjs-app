name: Weekly Price History Cleanup

on:
  schedule:
    - cron: "0 5 * * 0"  # Every Sunday at 5:00am UTC
  workflow_dispatch:       # Allow manual trigger

# 2026-09: runs via SSH against the netcup box's own scripts/run_cron.sh
# dispatcher instead of connecting to Postgres directly from GitHub's
# runners — see sync_awin.yml for the full rationale.
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Run price history cleanup on server
        env:
          SSH_KEY: ${{ secrets.NETCUP_SSH_KEY }}
          HOST: ${{ secrets.NETCUP_HOST }}
        run: |
          echo "$SSH_KEY" > key.pem && chmod 600 key.pem
          ssh -i key.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new deploy@$HOST "cleanup-price-history"
