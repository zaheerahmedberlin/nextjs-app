name: Deploy preisgucken.de

on:
  push:
    branches: [main]
  workflow_dispatch:       # allow a manual re-run from the GitHub UI

# A second push landing mid-deploy used to be able to race the first —
# queue instead of running concurrently, same pattern as sync_awin.yml.
concurrency:
  group: deploy-de
  cancel-in-progress: false

# Runs via SSH against the netcup box's own scripts/deploy.sh dispatcher,
# same forced-command pattern as the AWIN cron jobs — the SSH key can only
# ever run "deploy-de" or "deploy-com", nothing else. The dispatcher does
# git fetch + reset --hard + npm ci + build + restart on the server itself,
# and aborts before touching the running service if any step fails.
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to netcup
        env:
          SSH_KEY: ${{ secrets.NETCUP_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.NETCUP_HOST }}
        run: |
          echo "$SSH_KEY" > key.pem && chmod 600 key.pem
          # ServerAlive* keeps the SSH connection alive during npm run build,
          # which produces little/no output for several minutes at a time —
          # without this, something in the network path treats the session
          # as idle and drops it ("client_loop: send disconnect: Broken
          # pipe"), aborting the deploy mid-build. Confirmed live 2026-09-14:
          # exactly this killed a deploy, leaving category pages 500ing until
          # a retry completed. Same fix already applied to sync_awin.yml
          # after the identical failure mode hit check_dead_links.py.
          ssh -i key.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 deploy@$HOST "deploy-de"
